<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upcoming — Class Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --chalk-board: #22392f;
    --chalk-board-dark: #1a2d25;
    --chalk-cream: #f2ede1;
    --chalk-yellow: #e7b84f;
    --chalk-coral: #e2725b;
    --chalk-teal-line: #3f6355;
    --chalk-dim: #93a89b;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--chalk-board);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.025) 0, transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(255,255,255,0.02) 0, transparent 40%);
    color: var(--chalk-cream);
    font-family: 'Fraunces', serif;
    min-height: 100vh;
  }
  .wrap{ max-width: 680px; margin: 0 auto; padding: 48px 24px 80px; }

  .top-nav{ display:flex; justify-content:space-between; margin-bottom: 32px; gap: 8px; flex-wrap: wrap; }
  .top-nav .links{ display:flex; gap: 6px; }
  .top-nav a{
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--chalk-dim); text-decoration:none;
    border: 1px solid var(--chalk-teal-line); padding: 9px 14px; border-radius: 4px;
    transition: border-color 0.2s, color 0.2s;
  }
  .top-nav a:hover{ color: var(--chalk-yellow); border-color: var(--chalk-yellow); }
  .top-nav a.active{ color: var(--chalk-yellow); border-color: var(--chalk-yellow); }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--chalk-dim); margin-bottom: 10px;
  }
  .page-title{
    font-size: clamp(28px, 6vw, 42px); font-weight: 700;
    font-optical-sizing: auto; position: relative; display: inline-block;
    margin: 0 0 4px; line-height: 1.15;
  }
  .page-title .underline{ position:absolute; left: -2px; right: -2px; bottom: -6px; height: 8px; }
  .page-title .underline svg{ width:100%; height:100%; display:block; }
  .page-header-row{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .header-actions{
    margin-top: 14px;
  }
  .cal-btn-bulk{
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em;
    text-transform: uppercase; background: rgba(231,184,79,0.08); color: var(--chalk-yellow);
    border: 1px solid var(--chalk-yellow); padding: 9px 14px; border-radius: 4px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    transition: all 0.2s; font-weight: 500;
  }
  .cal-btn-bulk:hover{
    background: var(--chalk-yellow); color: var(--chalk-board-dark);
  }
  .cal-btn-bulk svg{ width: 14px; height: 14px; display: block; }

  .subline{
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--chalk-dim); margin-top: 14px; margin-bottom: 0;
  }

  .section-title{
    font-size: 19px; font-weight: 600; margin: 36px 0 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .section-title .count{
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--chalk-dim);
    border: 1px solid var(--chalk-teal-line); border-radius: 20px; padding: 3px 10px;
  }

  .event-card{
    display:grid; grid-template-columns: 64px 1fr auto; gap: 16px;
    align-items:center; padding: 16px 14px; margin-bottom: 10px;
    border: 1px solid var(--chalk-teal-line); border-radius: 8px;
    background: rgba(255,255,255,0.015); transition: border-color 0.2s;
  }
  .event-card:hover{ border-color: var(--chalk-dim); }
  .event-card.is-urgent{ border-color: var(--chalk-coral); background: rgba(226,114,91,0.06); }
  .event-card.is-past{ opacity: 0.55; }
  .event-date{ text-align:center; }
  .event-date .num{ font-size: 24px; font-weight: 700; line-height: 1; }
  .event-date .mon{
    font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase;
    color: var(--chalk-dim); letter-spacing: 0.06em; margin-top: 2px;
  }
  .event-body .event-name{ font-size: 17px; font-weight: 600; margin-bottom: 3px; }
  .event-body .event-meta{
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--chalk-dim);
  }

  .event-right{
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .event-tag-wrap{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .event-tag{
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 4px 9px; border-radius: 20px; white-space: nowrap;
    text-align:center; height: fit-content;
  }
  .event-tag.test{ background: rgba(231,184,79,0.15); color: var(--chalk-yellow); }
  .event-tag.submission{ background: rgba(226,114,91,0.15); color: var(--chalk-coral); }
  .event-countdown{
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--chalk-dim);
    text-align:right; white-space: nowrap;
  }
  .event-card.is-urgent .event-countdown{ color: var(--chalk-coral); }

  .event-cal-actions{
    display: flex;
    gap: 5px;
  }
  .cal-action-btn{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--chalk-teal-line);
    background: rgba(255,255,255,0.02);
    color: var(--chalk-dim);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    line-height: 1.4;
  }
  .cal-action-btn svg{ width: 11px; height: 11px; display: block; }
  .cal-action-btn:hover{
    border-color: var(--chalk-yellow);
    color: var(--chalk-yellow);
    background: rgba(231,184,79,0.08);
  }
  .cal-action-btn.gcal:hover{
    border-color: #60a5fa;
    color: #93c5fd;
    background: rgba(96,165,250,0.1);
  }

  .empty{
    padding: 28px 14px; color: var(--chalk-dim);
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    border: 1px dashed var(--chalk-teal-line); border-radius: 8px; text-align:center;
  }

  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--chalk-yellow); color: var(--chalk-board-dark);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600;
    padding: 10px 18px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 1000;
  }
  .toast.show{
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  .data-status{
    margin-top: 44px; border-top: 1px solid var(--chalk-teal-line); padding-top: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--chalk-dim);
    display:flex; align-items:center; justify-content:space-between; gap: 10px; flex-wrap:wrap;
  }
  .data-status.err{ color: var(--chalk-coral); }
  .data-status button{
    font-family: 'JetBrains Mono', monospace; font-size: 11px; background: transparent;
    color: var(--chalk-cream); border: 1px solid var(--chalk-teal-line); padding: 7px 12px;
    border-radius: 4px; cursor:pointer;
  }
  .data-status button:hover{ border-color: var(--chalk-yellow); color: var(--chalk-yellow); }

  @media (max-width: 540px){
    .wrap{ padding: 28px 16px 56px; }
    .top-nav{ gap: 6px; }
    .top-nav a{ padding: 8px 10px; font-size: 11px; }
    .page-header-row{ flex-direction: column; gap: 12px; }
    .header-actions{ margin-top: 0; width: 100%; }
    .cal-btn-bulk{ width: 100%; justify-content: center; }
    .event-card{ grid-template-columns: 48px 1fr; gap: 10px; padding: 14px 10px; }
    .event-right{ grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; border-top: 1px dashed rgba(63,99,85,0.6); padding-top: 10px; margin-top: 4px; }
    .event-date .num{ font-size: 20px; }
    .event-body .event-name{ font-size: 16px; }
    .section-title{ font-size: 17px; }
    .data-status{ flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <div class="links">
      <a href="index.html">Home</a>
      <a href="upcoming.html" class="active">Upcoming</a>
      <a href="month.html">Month</a>
    </div>
  </div>

  <div class="page-header-row">
    <div>
      <div class="eyebrow">Tests & assignments</div>
      <h1 class="page-title">
        <span>Coming up</span>
        <span class="underline"><svg viewBox="0 0 300 8" preserveAspectRatio="none"><path d="M2,5 C60,2 120,7 180,3 C220,1 260,6 298,4" stroke="#e7b84f" stroke-width="3" fill="none" stroke-linecap="round"/></svg></span>
      </h1>
      <div class="subline" id="todayLine">—</div>
    </div>
    <div class="header-actions">
      <button class="cal-btn-bulk" id="exportAllIcsBtn" title="Export all upcoming tests to an .ics calendar file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Export All (.ics)
      </button>
    </div>
  </div>

  <div class="section-title">
    <span>Due soon</span>
    <span class="count" id="soonCount">0</span>
  </div>
  <div id="soonList"></div>

  <div class="section-title">
    <span>Recently over</span>
    <span class="count" id="pastCount">0</span>
  </div>
  <div id="pastList"></div>

  <div class="section-title">
    <span>Further ahead</span>
    <span class="count" id="laterCount">0</span>
  </div>
  <div id="laterList"></div>

  <div class="data-status" id="dataStatus">
    <span id="dataStatusText">Loading class-data.xlsx…</span>
    <button id="refreshBtn">↻ Refresh</button>
  </div>
</div>

<div class="toast" id="toast">Calendar file downloaded!</div>

<script>
(function(){
  const XLSX_PATH = './class-data.xlsx';
  const STORAGE_CACHE = 'todays-class:data-cache-v3';
  const TEST_PATTERN = /test|exam|sed|quiz|viva/i;
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  // Visibility window: from 7 days before an event's date, through 5 days after.
  const DAYS_BEFORE = 7;
  const DAYS_AFTER = 5;

  let classRows = [];
  let subRows = [];
  let currentEvents = [];
  let toastTimer = null;

  const el = {
    todayLine: document.getElementById('todayLine'),
    soonList: document.getElementById('soonList'),
    soonCount: document.getElementById('soonCount'),
    pastList: document.getElementById('pastList'),
    pastCount: document.getElementById('pastCount'),
    laterList: document.getElementById('laterList'),
    laterCount: document.getElementById('laterCount'),
    dataStatus: document.getElementById('dataStatus'),
    dataStatusText: document.getElementById('dataStatusText'),
    refreshBtn: document.getElementById('refreshBtn'),
    exportAllIcsBtn: document.getElementById('exportAllIcsBtn'),
    toast: document.getElementById('toast'),
  };

  function pad(n){ return String(n).padStart(2,'0'); }
  function startOfDay(d){ const c = new Date(d); c.setHours(0,0,0,0); return c; }
  function nextDay(d){ const c = new Date(d); c.setDate(c.getDate() + 1); return c; }
  function daysBetween(a, b){ return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }
  function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

  function fmtTime(h, m){
    const ampm = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return `${h12}:${pad(m)} ${ampm}`;
  }

  function parseTimeToken(tok){
    let [h, m] = tok.trim().split(':').map(Number);
    if (h >= 1 && h <= 7) h += 12;
    return { h, m: m || 0 };
  }

  function parseTimeRange(raw){
    const parts = String(raw || '').split('-').map(s => s.trim());
    if (parts.length !== 2 || !parts[0] || !parts[1]) return null;
    const s = parseTimeToken(parts[0]);
    const e = parseTimeToken(parts[1]);
    return {
      startH: s.h,
      startM: s.m,
      endH: e.h,
      endM: e.m,
      startMin: s.h * 60 + s.m,
      endMin: e.h * 60 + e.m,
      label: `${fmtTime(s.h, s.m)} – ${fmtTime(e.h, e.m)}`
    };
  }

  function excelDateToJS(v){
    if (v instanceof Date) return v;
    if (typeof v === 'number'){
      const parsed = XLSX.SSF.parse_date_code(v);
      if (parsed) return new Date(parsed.y, parsed.m - 1, parsed.d);
    }
    if (typeof v === 'string'){
      const d = new Date(v);
      if (!isNaN(d)) return d;
    }
    return null;
  }

  function findSheet(workbook, keyword){
    const name = workbook.SheetNames.find(n => n.toLowerCase().includes(keyword));
    return name ? workbook.Sheets[name] : null;
  }

  function parseWorkbook(workbook){
    // 1. Build staff directory map
    const staffMap = {};
    const staffSheet = findSheet(workbook, 'staff') || findSheet(workbook, 'faculty');
    if (staffSheet){
      XLSX.utils.sheet_to_json(staffSheet, { defval: '' }).forEach(r => {
        const legendKey = Object.keys(r).find(k => /^(legend|code|initials?|abbr|short|faculty)/i.test(k.trim())) || 'Legend';
        const nameKey = Object.keys(r).find(k => /^(name|staff\s*name|faculty\s*name)/i.test(k.trim())) || 'Name';
        const titleKey = Object.keys(r).find(k => /^(title|salutation|prefix)/i.test(k.trim())) || 'Title';
        const areaKey = Object.keys(r).find(k => /^(area|department|dept)/i.test(k.trim())) || 'Area';

        const legend = String(r[legendKey] ?? '').trim();
        const title = String(r[titleKey] ?? '').trim();
        const name = String(r[nameKey] ?? '').trim();
        const area = String(r[areaKey] ?? '').trim();

        if (legend){
          const fullName = [title, name].filter(Boolean).join(' ').trim() || name || legend;
          const entry = { legend, title, name, fullName, area };
          staffMap[legend.toUpperCase()] = entry;
          const normLegend = legend.replace(/[\s.-]/g, '').toUpperCase();
          if (normLegend && normLegend !== legend.toUpperCase()){
            staffMap[normLegend] = entry;
          }
        }
      });
    }

    function resolveStaff(r){
      // Check for explicit staff column in the row (e.g. 'staf ', 'staff', 'Staff Name', etc.)
      const staffKey = Object.keys(r).find(k => /^staf/i.test(k.trim()) || /^staff\s*name/i.test(k.trim()) || /^faculty\s*name/i.test(k.trim()));
      const explicitStaff = staffKey ? String(r[staffKey] ?? '').trim() : '';

      const faculty = String(r['Faculty'] ?? '').trim();
      let staffName = '';
      let staffArea = '';

      if (explicitStaff){
        staffName = explicitStaff;
        const lookup = staffMap[explicitStaff.toUpperCase()] || staffMap[explicitStaff.replace(/[\s.-]/g, '').toUpperCase()];
        if (lookup){
          staffName = lookup.fullName;
          staffArea = lookup.area;
        }
      }

      if (!staffName && faculty){
        const lookup = staffMap[faculty.toUpperCase()] || staffMap[faculty.replace(/[\s.-]/g, '').toUpperCase()];
        if (lookup){
          staffName = lookup.fullName;
          staffArea = lookup.area;
        }
      }

      return { faculty, staffName, staffArea };
    }

    const rows1 = [];
    const ttSheet = findSheet(workbook, 'time') || workbook.Sheets[workbook.SheetNames[0]];
    if (ttSheet){
      XLSX.utils.sheet_to_json(ttSheet, { defval: '' }).forEach(r => {
        const date = excelDateToJS(r['Date']);
        if (!date) return;
        const course = String(r['Course'] ?? '').trim();
        if (!course || course === '--') return;
        const tr = parseTimeRange(r['Time']);
        const { faculty, staffName, staffArea } = resolveStaff(r);
        rows1.push({
          date,
          course,
          faculty,
          staffName,
          staffArea,
          hall: r['Hall No.'] !== undefined ? String(r['Hall No.']).trim() : '',
          timeRange: tr,
          timeLabel: tr ? tr.label : String(r['Time'] ?? '')
        });
      });
    }
    const rows2 = [];
    const subSheet = findSheet(workbook, 'submission');
    if (subSheet){
      XLSX.utils.sheet_to_json(subSheet, { defval: '' }).forEach(r => {
        const date = excelDateToJS(r['Date']);
        if (!date) return;
        const aKey = Object.keys(r).find(k => k.toLowerCase().includes('assignment'));
        const { faculty, staffName, staffArea } = resolveStaff(r);
        rows2.push({
          date,
          course: String(r['Course'] ?? '').trim(),
          faculty,
          staffName,
          staffArea,
          assignment: aKey ? String(r[aKey] ?? '').trim() : ''
        });
      });
    }
    return { classRows: rows1, subRows: rows2, staffCount: Object.keys(staffMap).length };
  }

  async function cacheData(data){
    const payload = JSON.stringify({
      classRows: data.classRows.map(r => ({
        ...r,
        date: r.date.toISOString()
      })),
      subRows: data.subRows.map(r => ({
        ...r,
        date: r.date.toISOString()
      }))
    });
    try { localStorage.setItem(STORAGE_CACHE, payload); } catch(e){}
    try {
      if (window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(STORAGE_CACHE, payload, false);
      }
    } catch(e){}
  }

  async function loadCachedData(){
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_CACHE); } catch(e){}
    if (!raw){
      try {
        if (window.storage && typeof window.storage.get === 'function'){
          const res = await window.storage.get(STORAGE_CACHE, false);
          if (res && res.value) raw = res.value;
        }
      } catch(e){}
    }
    if (!raw) return null;
    try {
      const parsed = JSON.parse(raw);
      return {
        classRows: parsed.classRows.map(r => ({
          ...r,
          date: new Date(r.date),
          timeRange: r.timeRange || (r.timeLabel ? parseTimeRange(r.timeLabel) : null)
        })),
        subRows: parsed.subRows.map(r => ({...r, date: new Date(r.date)}))
      };
    } catch(e){ return null; }
  }

  async function loadData(showStatus){
    if (showStatus){ el.dataStatusText.textContent = 'Fetching class-data.xlsx…'; el.dataStatus.className = 'data-status'; }
    try{
      const resp = await fetch(XLSX_PATH, { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const buf = await resp.arrayBuffer();
      const workbook = XLSX.read(buf, { type: 'array', cellDates: false });
      const data = parseWorkbook(workbook);
      classRows = data.classRows;
      subRows = data.subRows;
      await cacheData(data);
      const staffInfo = data.staffCount ? `, ${data.staffCount} staff` : '';
      el.dataStatusText.textContent = `Loaded ${classRows.length} periods, ${subRows.length} submissions${staffInfo} — ${new Date().toLocaleTimeString()}`;
      el.dataStatus.className = 'data-status';
      return true;
    } catch(err){
      const cached = await loadCachedData();
      if (cached){
        classRows = cached.classRows;
        subRows = cached.subRows;
        el.dataStatusText.textContent = `Couldn't reach class-data.xlsx — showing last saved copy.`;
        el.dataStatus.className = 'data-status err';
        return true;
      }
      el.dataStatusText.textContent = `Couldn't load class-data.xlsx. Make sure it sits in the same folder as this page.`;
      el.dataStatus.className = 'data-status err';
      return false;
    }
  }

  // --- Calendar Generator Helpers ---

  function formatIcsDateTime(d, h, m){
    const year = d.getFullYear();
    const mon = pad(d.getMonth() + 1);
    const day = pad(d.getDate());
    const hours = pad(h || 0);
    const mins = pad(m || 0);
    return `${year}${mon}${day}T${hours}${mins}00`;
  }

  function formatIcsDateOnly(d){
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  }

  function formatGcalDateTime(d, h, m){
    return formatIcsDateTime(d, h, m);
  }

  function formatGcalDateOnly(d){
    return formatIcsDateOnly(d);
  }

  function escapeIcsText(str){
    return String(str || '')
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }

  function generateIcsForEvents(events, calTitle){
    const nowStamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//College Time Table//EN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      `X-WR-CALNAME:${escapeIcsText(calTitle || 'Upcoming Tests & Exams')}`
    ];

    events.forEach(e => {
      const summary = `${e.title}${e.type === 'test' ? ' (Test)' : ' (Due)'}`;
      const descParts = [];
      if (e.type === 'test') descParts.push('Type: College Exam / Test');
      if (e.type === 'submission') descParts.push('Type: Assignment Submission');
      if (e.course && e.course !== e.title) descParts.push(`Course: ${e.course}`);
      if (e.staffName) {
        descParts.push(`Staff: ${e.staffName}${e.faculty && e.faculty !== e.staffName ? ` (${e.faculty})` : ''}`);
      } else if (e.faculty) {
        descParts.push(`Faculty: ${e.faculty}`);
      }
      if (e.hall) descParts.push(`Hall: ${e.hall}`);
      if (e.timeRange && e.timeRange.label) descParts.push(`Time: ${e.timeRange.label}`);

      const location = e.hall ? `Hall ${e.hall}` : '';

      lines.push('BEGIN:VEVENT');
      lines.push(`UID:${e.id || ('event-' + Math.random().toString(36).slice(2))}@college-timetable`);
      lines.push(`DTSTAMP:${nowStamp}`);
      if (e.timeRange){
        lines.push(`DTSTART:${formatIcsDateTime(e.date, e.timeRange.startH, e.timeRange.startM)}`);
        lines.push(`DTEND:${formatIcsDateTime(e.date, e.timeRange.endH, e.timeRange.endM)}`);
      } else {
        lines.push(`DTSTART;VALUE=DATE:${formatIcsDateOnly(e.date)}`);
        lines.push(`DTEND;VALUE=DATE:${formatIcsDateOnly(nextDay(e.date))}`);
      }
      lines.push(`SUMMARY:${escapeIcsText(summary)}`);
      if (descParts.length) lines.push(`DESCRIPTION:${escapeIcsText(descParts.join('\n'))}`);
      if (location) lines.push(`LOCATION:${escapeIcsText(location)}`);
      lines.push('STATUS:CONFIRMED');
      lines.push('TRANSP:OPAQUE');
      lines.push('END:VEVENT');
    });

    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }

  function downloadIcsFile(filename, content){
    const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`Downloaded ${filename}`);
  }

  function getGoogleCalendarUrl(e){
    const title = `${e.title}${e.type === 'test' ? ' (Test)' : ' (Due)'}`;
    let dates = '';
    if (e.timeRange){
      dates = `${formatGcalDateTime(e.date, e.timeRange.startH, e.timeRange.startM)}/${formatGcalDateTime(e.date, e.timeRange.endH, e.timeRange.endM)}`;
    } else {
      dates = `${formatGcalDateOnly(e.date)}/${formatGcalDateOnly(nextDay(e.date))}`;
    }
    const descParts = [];
    if (e.type === 'test') descParts.push('Type: College Exam / Test');
    if (e.type === 'submission') descParts.push('Type: Assignment Submission');
    if (e.course && e.course !== e.title) descParts.push(`Course: ${e.course}`);
    if (e.staffName) {
      descParts.push(`Staff: ${e.staffName}${e.faculty && e.faculty !== e.staffName ? ` (${e.faculty})` : ''}`);
    } else if (e.faculty) {
      descParts.push(`Faculty: ${e.faculty}`);
    }
    if (e.hall) descParts.push(`Hall: ${e.hall}`);
    if (e.timeRange && e.timeRange.label) descParts.push(`Time: ${e.timeRange.label}`);

    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: title,
      dates: dates,
      details: descParts.join('\n'),
      location: e.hall ? `Hall ${e.hall}` : ''
    });
    return `https://calendar.google.com/calendar/render?${params.toString()}`;
  }

  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.toast.classList.remove('show');
    }, 2800);
  }

  function buildEvents(){
    const testMap = new Map();
    classRows.forEach(r => {
      if (!TEST_PATTERN.test(r.course)) return;
      const key = startOfDay(r.date).getTime() + '|' + r.course;
      if (!testMap.has(key)){
        const safeId = 'test-' + startOfDay(r.date).getTime() + '-' + r.course.replace(/\W+/g, '-').toLowerCase();
        const facultyDisplay = r.staffName
          ? (r.faculty && r.faculty !== r.staffName ? `${r.staffName} (${r.faculty})` : r.staffName)
          : r.faculty;
        const metaParts = [facultyDisplay, r.hall ? `Hall ${r.hall}` : '', r.timeLabel].filter(Boolean);
        testMap.set(key, {
          id: safeId,
          date: r.date,
          title: r.course,
          course: r.course,
          type: 'test',
          hall: r.hall,
          faculty: r.faculty,
          staffName: r.staffName,
          meta: metaParts.join(' · '),
          timeRange: r.timeRange
        });
      }
    });

    const submissionEvents = subRows.map(r => {
      const safeId = 'sub-' + startOfDay(r.date).getTime() + '-' + (r.assignment || r.course).replace(/\W+/g, '-').toLowerCase();
      const sFaculty = r.staffName
        ? (r.faculty && r.faculty !== r.staffName ? `${r.staffName} (${r.faculty})` : r.staffName)
        : r.faculty;
      const metaParts = [r.course, sFaculty].filter(Boolean);
      return {
        id: safeId,
        date: r.date,
        title: r.assignment ? r.assignment : (r.course || 'Submission'),
        course: r.course,
        faculty: r.faculty,
        staffName: r.staffName,
        type: 'submission',
        hall: '',
        meta: metaParts.join(' · '),
        timeRange: null
      };
    });

    const all = [...testMap.values(), ...submissionEvents];
    all.sort((a,b) => a.date - b.date);
    return all;
  }

  function countdownLabel(days){
    if (days === 0) return 'Today';
    if (days === 1) return 'Tomorrow';
    if (days === -1) return 'Yesterday';
    if (days > 0) return `In ${days} days`;
    return `${Math.abs(days)} days ago`;
  }

  function renderCard(evt, today){
    const days = daysBetween(today, evt.date);
    const urgent = days >= 0 && days <= 2;
    const isPast = days < 0;
    const day = evt.date.getDate();
    const mon = MONTHS[evt.date.getMonth()];
    const tagLabel = evt.type === 'test' ? 'Test' : 'Submission';
    const gcalUrl = getGoogleCalendarUrl(evt);

    const div = document.createElement('div');
    div.className = 'event-card' + (urgent ? ' is-urgent' : '') + (isPast ? ' is-past' : '');
    div.innerHTML = `
      <div class="event-date">
        <div class="num">${day}</div>
        <div class="mon">${mon}</div>
      </div>
      <div class="event-body">
        <div class="event-name">${escapeHtml(evt.title)}</div>
        <div class="event-meta">${escapeHtml(evt.meta || '')}</div>
      </div>
      <div class="event-right">
        <div class="event-tag-wrap">
          <div class="event-tag ${evt.type}">${tagLabel}</div>
          <div class="event-countdown">${countdownLabel(days)}</div>
        </div>
        <div class="event-cal-actions">
          <a href="${gcalUrl}" target="_blank" rel="noopener noreferrer" class="cal-action-btn gcal" title="Add directly to Google Calendar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            + GCal
          </a>
          <button type="button" class="cal-action-btn ics" data-id="${evt.id}" title="Download .ics for Apple Calendar / Outlook">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            .ics
          </button>
        </div>
      </div>
    `;

    const icsBtn = div.querySelector('.cal-action-btn.ics');
    if (icsBtn){
      icsBtn.addEventListener('click', () => {
        const safeName = (evt.title || 'event').replace(/\W+/g, '-').toLowerCase();
        const content = generateIcsForEvents([evt], evt.title);
        downloadIcsFile(`${safeName}.ics`, content);
      });
    }

    return div;
  }

  function render(){
    const today = startOfDay(new Date());
    el.todayLine.textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });

    currentEvents = buildEvents();
    const soon = currentEvents.filter(e => { const d = daysBetween(today, e.date); return d >= 0 && d <= DAYS_BEFORE; });
    const past = currentEvents.filter(e => { const d = daysBetween(today, e.date); return d < 0 && d >= -DAYS_AFTER; });
    const later = currentEvents.filter(e => daysBetween(today, e.date) > DAYS_BEFORE);

    el.soonCount.textContent = soon.length;
    el.pastCount.textContent = past.length;
    el.laterCount.textContent = later.length;

    el.soonList.innerHTML = '';
    if (soon.length === 0) el.soonList.innerHTML = '<div class="empty">Nothing due in the next 7 days.</div>';
    else soon.forEach(evt => el.soonList.appendChild(renderCard(evt, today)));

    el.pastList.innerHTML = '';
    if (past.length === 0) el.pastList.innerHTML = '<div class="empty">Nothing finished in the last 5 days.</div>';
    else past.sort((a,b)=>b.date-a.date).forEach(evt => el.pastList.appendChild(renderCard(evt, today)));

    el.laterList.innerHTML = '';
    if (later.length === 0) el.laterList.innerHTML = '<div class="empty">Nothing else on the horizon yet.</div>';
    else later.forEach(evt => el.laterList.appendChild(renderCard(evt, today)));
  }

  el.exportAllIcsBtn.addEventListener('click', () => {
    const today = startOfDay(new Date());
    // Export upcoming tests and submissions from today onwards (or all tests if none upcoming)
    let targets = currentEvents.filter(e => daysBetween(today, e.date) >= 0);
    if (targets.length === 0) targets = currentEvents;
    if (targets.length === 0){
      showToast('No upcoming tests found to export.');
      return;
    }
    const content = generateIcsForEvents(targets, 'College Schedule — Tests & Assignments');
    downloadIcsFile('college-schedule-exams.ics', content);
  });

  el.refreshBtn.addEventListener('click', async () => {
    await loadData(true);
    render();
  });

  async function init(){
    const cached = await loadCachedData();
    if (cached){ classRows = cached.classRows; subRows = cached.subRows; render(); }
    await loadData(false);
    render();
  }

  init();
})();
</script>
</body>
