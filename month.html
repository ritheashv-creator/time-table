<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month — Class Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --chalk-board: #22392f;
    --chalk-board-dark: #1a2d25;
    --chalk-cream: #f2ede1;
    --chalk-yellow: #e7b84f;
    --chalk-coral: #e2725b;
    --chalk-teal-line: #3f6355;
    --chalk-dim: #93a89b;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--chalk-board);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.025) 0, transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(255,255,255,0.02) 0, transparent 40%);
    color: var(--chalk-cream);
    font-family: 'Fraunces', serif;
    min-height: 100vh;
  }
  .wrap{ max-width: 680px; margin: 0 auto; padding: 48px 24px 80px; }

  .top-nav{ display:flex; justify-content:space-between; margin-bottom: 32px; gap: 8px; flex-wrap: wrap; }
  .top-nav .links{ display:flex; gap: 6px; }
  .top-nav a{
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--chalk-dim); text-decoration:none;
    border: 1px solid var(--chalk-teal-line); padding: 9px 14px; border-radius: 4px;
    transition: border-color 0.2s, color 0.2s;
  }
  .top-nav a:hover{ color: var(--chalk-yellow); border-color: var(--chalk-yellow); }
  .top-nav a.active{ color: var(--chalk-yellow); border-color: var(--chalk-yellow); }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--chalk-dim); margin-bottom: 10px;
  }
  .page-title{
    font-size: clamp(28px, 6vw, 42px); font-weight: 700;
    font-optical-sizing: auto; position: relative; display: inline-block;
    margin: 0 0 4px; line-height: 1.15;
  }
  .page-title .underline{ position:absolute; left: -2px; right: -2px; bottom: -6px; height: 8px; }
  .page-title .underline svg{ width:100%; height:100%; display:block; }

  .month-header{ display:flex; align-items:center; justify-content:space-between; margin: 36px 0 18px; }
  .month-title{ font-size: 21px; font-weight: 600; }
  .month-nav{ display:flex; gap: 6px; }
  button{
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; background: transparent; color: var(--chalk-cream);
    border: 1px solid var(--chalk-teal-line); padding: 8px 12px; border-radius: 4px;
    cursor: pointer; transition: border-color 0.2s, color 0.2s;
  }
  button:hover{ border-color: var(--chalk-yellow); color: var(--chalk-yellow); }

  .month-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .month-dow{
    font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase;
    color: var(--chalk-dim); text-align:center; padding-bottom: 6px; letter-spacing: 0.06em;
  }
  .month-cell{
    aspect-ratio: 1; display:flex; flex-direction: column; align-items:center;
    justify-content:center; border-radius: 6px; font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--chalk-dim); cursor: pointer; position: relative;
    border: 1px solid transparent; transition: border-color 0.15s, background 0.15s;
  }
  .month-cell.outside{ opacity: 0.25; cursor: default; }
  .month-cell:not(.outside):hover{ border-color: var(--chalk-teal-line); }
  .month-cell.has-class{ color: var(--chalk-cream); }
  .month-cell.has-class::after{
    content:''; width: 4px; height: 4px; border-radius: 50%;
    background: var(--chalk-yellow); position: absolute; bottom: 6px;
  }
  .month-cell.no-class-day{ color: var(--chalk-coral); }
  .month-cell.has-test{ border-color: var(--chalk-coral); }
  .month-cell.has-test::before{
    content:''; width: 4px; height: 4px; border-radius: 50%;
    background: var(--chalk-coral); position: absolute; top: 6px;
  }
  .month-cell.is-today{ border-color: var(--chalk-coral); color: var(--chalk-cream); font-weight: 700; }
  .month-cell.is-selected{ background: var(--chalk-yellow); color: var(--chalk-board-dark); font-weight: 700; }
  .month-cell.is-selected.has-class::after{ background: var(--chalk-board-dark); }
  .month-cell.is-selected.has-test::before{ background: var(--chalk-board-dark); }
  .month-legend{ font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--chalk-dim); margin-top: 14px; line-height:1.8; }
  .month-legend .dot{
    display:inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--chalk-yellow); margin-right: 6px;
  }
  .month-legend .dot.coral{ background: var(--chalk-coral); }

  .preview{
    margin-top: 36px; border-top: 1px solid var(--chalk-teal-line); padding-top: 24px;
    display: none;
  }
  .preview.open{ display: block; }
  .preview-title{ font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .preview-sub{
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--chalk-dim);
    margin-bottom: 18px;
  }
  .period{
    display:grid; grid-template-columns: 88px 1fr; gap: 16px;
    align-items: center; padding: 14px 6px;
    border-bottom: 1px solid var(--chalk-teal-line);
  }
  .period.is-test{ background: rgba(226,114,91,0.06); }
  .period-time{
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--chalk-dim); white-space: nowrap;
  }
  .period-name{ font-size: 18px; font-weight: 600; }
  .period-room{
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--chalk-dim); margin-top: 2px;
  }
  .empty{
    padding: 28px 6px; color: var(--chalk-dim);
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
  }
  .sub-note{
    margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--chalk-coral);
    border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--chalk-coral);
  }
  .preview-actions{ margin-top: 18px; }
  .preview-actions a{
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; text-decoration:none;
    background: var(--chalk-yellow); color: var(--chalk-board-dark);
    padding: 10px 16px; border-radius: 4px; font-weight: 700; display:inline-block;
  }
  .preview-actions a:hover{ opacity: 0.9; }

  .data-status{
    margin-top: 44px; border-top: 1px solid var(--chalk-teal-line); padding-top: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--chalk-dim);
    display:flex; align-items:center; justify-content:space-between; gap: 10px; flex-wrap:wrap;
  }
  .data-status.err{ color: var(--chalk-coral); }
  .data-status button{ font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 7px 12px; }

  @media (max-width: 480px){
    .wrap{ padding: 28px 16px 56px; }
    .top-nav{ gap: 6px; }
    .top-nav a{ padding: 8px 10px; font-size: 11px; }
    .month-grid{ gap: 3px; }
    .month-cell{ font-size: 12px; }
    .month-header{ margin: 28px 0 14px; }
    .month-nav button{ padding: 7px 9px; font-size: 11px; }
    .period{ grid-template-columns: 68px 1fr; gap: 10px; padding: 12px 4px; }
    .period-name{ font-size: 16px; }
    .data-status{ flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <div class="links">
      <a href="index.html">Home</a>
      <a href="upcoming.html">Upcoming</a>
      <a href="month.html" class="active">Month</a>
    </div>
  </div>

  <div class="eyebrow">Class calendar</div>
  <h1 class="page-title">
    <span>This month</span>
    <span class="underline"><svg viewBox="0 0 300 8" preserveAspectRatio="none"><path d="M2,5 C60,2 120,7 180,3 C220,1 260,6 298,4" stroke="#e7b84f" stroke-width="3" fill="none" stroke-linecap="round"/></svg></span>
  </h1>

  <div class="month-header">
    <div class="month-title" id="monthTitle">—</div>
    <div class="month-nav">
      <button id="prevMonthBtn">←</button>
      <button id="todayBtn">Today</button>
      <button id="nextMonthBtn">→</button>
    </div>
  </div>
  <div class="month-grid" id="monthGrid"></div>
  <div class="month-legend">
    <div><span class="dot"></span>days with class · <span class="dot coral"></span>test / exam day</div>
    <div><span style="color:var(--chalk-coral)">Red dates</span> are holidays — no classes. Tap a date to preview it.</div>
  </div>

  <div class="preview" id="preview">
    <div class="preview-title" id="previewTitle">—</div>
    <div class="preview-sub" id="previewSub"></div>
    <div id="previewList"></div>
    <div id="subNote"></div>
    <div class="preview-actions">
      <a id="editLink" href="index.html">Open in Today →</a>
    </div>
  </div>

  <div class="data-status" id="dataStatus">
    <span id="dataStatusText">Loading class-data.xlsx…</span>
    <button id="refreshBtn">↻ Refresh</button>
  </div>
</div>

<script>
(function(){
  const XLSX_PATH = './class-data.xlsx';
  const STORAGE_CACHE = 'todays-class:data-cache-v2';
  const TEST_PATTERN = /test|exam|sed|quiz|viva/i;

  let classRows = [];
  let subRows = [];
  let viewMonth = new Date();
  let selectedDate = null;

  const el = {
    monthTitle: document.getElementById('monthTitle'),
    monthGrid: document.getElementById('monthGrid'),
    prevMonthBtn: document.getElementById('prevMonthBtn'),
    nextMonthBtn: document.getElementById('nextMonthBtn'),
    todayBtn: document.getElementById('todayBtn'),
    preview: document.getElementById('preview'),
    previewTitle: document.getElementById('previewTitle'),
    previewSub: document.getElementById('previewSub'),
    previewList: document.getElementById('previewList'),
    subNote: document.getElementById('subNote'),
    editLink: document.getElementById('editLink'),
    dataStatus: document.getElementById('dataStatus'),
    dataStatusText: document.getElementById('dataStatusText'),
    refreshBtn: document.getElementById('refreshBtn'),
  };

  function pad(n){ return String(n).padStart(2,'0'); }
  function sameDay(a,b){ return a.toDateString() === b.toDateString(); }
  function fmtTime(h,m){
    const ampm = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return `${h12}:${pad(m)} ${ampm}`;
  }
  function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

  function excelDateToJS(v){
    if (v instanceof Date) return v;
    if (typeof v === 'number'){
      const parsed = XLSX.SSF.parse_date_code(v);
      if (parsed) return new Date(parsed.y, parsed.m - 1, parsed.d);
    }
    if (typeof v === 'string'){
      const d = new Date(v);
      if (!isNaN(d)) return d;
    }
    return null;
  }
  function parseTimeToken(tok){
    let [h,m] = tok.trim().split(':').map(Number);
    if (h >= 1 && h <= 7) h += 12;
    return { h, m: m || 0 };
  }
  function parseTimeRange(raw){
    const parts = String(raw || '').split('-').map(s => s.trim());
    if (parts.length !== 2 || !parts[0] || !parts[1]) return null;
    const s = parseTimeToken(parts[0]);
    const e = parseTimeToken(parts[1]);
    return { startMin: s.h*60+s.m, label: `${fmtTime(s.h,s.m)} – ${fmtTime(e.h,e.m)}` };
  }

  function findSheet(workbook, keyword){
    const name = workbook.SheetNames.find(n => n.toLowerCase().includes(keyword));
    return name ? workbook.Sheets[name] : null;
  }

  function parseWorkbook(workbook){
    const rows1 = [];
    const ttSheet = findSheet(workbook, 'time') || workbook.Sheets[workbook.SheetNames[0]];
    if (ttSheet){
      XLSX.utils.sheet_to_json(ttSheet, { defval: '' }).forEach(r => {
        const date = excelDateToJS(r['Date']);
        if (!date) return;
        const course = String(r['Course'] ?? '').trim();
        if (!course || course === '--') return;
        const tr = parseTimeRange(r['Time']);
        rows1.push({
          date, course,
          faculty: String(r['Faculty'] ?? '').trim(),
          hall: r['Hall No.'] !== undefined ? String(r['Hall No.']).trim() : '',
          timeLabel: tr ? tr.label : String(r['Time'] ?? ''),
          startMin: tr ? tr.startMin : 0,
          isTest: TEST_PATTERN.test(course)
        });
      });
    }
    const rows2 = [];
    const subSheet = findSheet(workbook, 'submission');
    if (subSheet){
      XLSX.utils.sheet_to_json(subSheet, { defval: '' }).forEach(r => {
        const date = excelDateToJS(r['Date']);
        if (!date) return;
        const aKey = Object.keys(r).find(k => k.toLowerCase().includes('assignment'));
        rows2.push({
          date,
          course: String(r['Course'] ?? '').trim(),
          faculty: String(r['Faculty'] ?? '').trim(),
          assignment: aKey ? String(r[aKey] ?? '').trim() : ''
        });
      });
    }
    return { classRows: rows1, subRows: rows2 };
  }

  async function cacheData(data){
    try{
      await window.storage.set(STORAGE_CACHE, JSON.stringify({
        classRows: data.classRows.map(r => ({...r, date: r.date.toISOString()})),
        subRows: data.subRows.map(r => ({...r, date: r.date.toISOString()}))
      }), false);
    } catch(err){ /* non-fatal */ }
  }
  async function loadCachedData(){
    try{
      const res = await window.storage.get(STORAGE_CACHE, false);
      if (!res || !res.value) return null;
      const parsed = JSON.parse(res.value);
      return {
        classRows: parsed.classRows.map(r => ({...r, date: new Date(r.date)})),
        subRows: parsed.subRows.map(r => ({...r, date: new Date(r.date)}))
      };
    } catch(err){ return null; }
  }

  async function loadData(showStatus){
    if (showStatus){ el.dataStatusText.textContent = 'Fetching class-data.xlsx…'; el.dataStatus.className = 'data-status'; }
    try{
      const resp = await fetch(XLSX_PATH, { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const buf = await resp.arrayBuffer();
      const workbook = XLSX.read(buf, { type: 'array', cellDates: false });
      const data = parseWorkbook(workbook);
      classRows = data.classRows;
      subRows = data.subRows;
      await cacheData(data);
      el.dataStatusText.textContent = `Loaded ${classRows.length} periods, ${subRows.length} submissions — ${new Date().toLocaleTimeString()}`;
      el.dataStatus.className = 'data-status';
      return true;
    } catch(err){
      const cached = await loadCachedData();
      if (cached){
        classRows = cached.classRows;
        subRows = cached.subRows;
        el.dataStatusText.textContent = `Couldn't reach class-data.xlsx — showing last saved copy.`;
        el.dataStatus.className = 'data-status err';
        return true;
      }
      el.dataStatusText.textContent = `Couldn't load class-data.xlsx. Make sure it sits in the same folder as this page.`;
      el.dataStatus.className = 'data-status err';
      return false;
    }
  }

  function renderMonth(){
    const y = viewMonth.getFullYear();
    const m = viewMonth.getMonth();
    el.monthTitle.textContent = viewMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    const firstOfMonth = new Date(y, m, 1);
    const startOffset = firstOfMonth.getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const daysInPrevMonth = new Date(y, m, 0).getDate();

    const today = new Date();
    const cells = [];

    for (let i = 0; i < startOffset; i++){
      const dayNum = daysInPrevMonth - startOffset + 1 + i;
      cells.push({ dayNum, outside: true, date: new Date(y, m - 1, dayNum) });
    }
    for (let d = 1; d <= daysInMonth; d++){
      cells.push({ dayNum: d, outside: false, date: new Date(y, m, d) });
    }
    let trail = 1;
    while (cells.length % 7 !== 0){
      cells.push({ dayNum: trail, outside: true, date: new Date(y, m + 1, trail) });
      trail++;
    }

    const dowHtml = ['S','M','T','W','T','F','S'].map(d => `<div class="month-dow">${d}</div>`).join('');

    const cellsHtml = cells.map(c => {
      const dayRows = classRows.filter(r => sameDay(r.date, c.date));
      const hasClass = !c.outside && dayRows.length > 0;
      const hasTest = !c.outside && dayRows.some(r => r.isTest);
      const isToday = !c.outside && sameDay(c.date, today);
      const isSelected = !c.outside && selectedDate && sameDay(c.date, selectedDate);
      const classes = ['month-cell'];
      if (c.outside) classes.push('outside');
      if (hasClass) classes.push('has-class');
      if (!c.outside && !hasClass) classes.push('no-class-day');
      if (hasTest) classes.push('has-test');
      if (isToday) classes.push('is-today');
      if (isSelected) classes.push('is-selected');
      return `<div class="${classes.join(' ')}" data-date="${c.date.toISOString()}">${c.dayNum}</div>`;
    }).join('');

    el.monthGrid.innerHTML = dowHtml + cellsHtml;

    el.monthGrid.querySelectorAll('.month-cell:not(.outside)').forEach(cell => {
      cell.addEventListener('click', () => {
        selectedDate = new Date(cell.dataset.date);
        renderMonth();
        renderPreview();
      });
    });
  }

  function renderPreview(){
    if (!selectedDate){
      el.preview.classList.remove('open');
      return;
    }
    el.preview.classList.add('open');
    const periods = classRows.filter(r => sameDay(r.date, selectedDate)).sort((a,b) => a.startMin - b.startMin);
    const dayName = selectedDate.toLocaleDateString(undefined, { weekday: 'long' });

    const isHoliday = periods.length === 0;
    el.previewTitle.textContent = dayName + (isHoliday ? ' — Holiday' : '');
    el.previewSub.textContent = selectedDate.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
    el.editLink.href = `index.html?date=${selectedDate.toISOString().slice(0,10)}`;

    if (periods.length === 0){
      el.previewList.innerHTML = `<div class="empty">Holiday — no classes scheduled.</div>`;
    } else {
      el.previewList.innerHTML = periods.map(p => `
        <div class="period${p.isTest ? ' is-test' : ''}">
          <div class="period-time">${p.timeLabel}</div>
          <div>
            <div class="period-name">${escapeHtml(p.course)}</div>
            ${p.hall ? `<div class="period-room">Hall ${escapeHtml(p.hall)}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    const subsToday = subRows.filter(r => sameDay(r.date, selectedDate));
    el.subNote.innerHTML = subsToday.map(s =>
      `<div class="sub-note">Due: ${escapeHtml(s.assignment || 'Submission')}${s.course ? ' — ' + escapeHtml(s.course) : ''}</div>`
    ).join('');
  }

  el.prevMonthBtn.addEventListener('click', () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1);
    renderMonth();
  });
  el.nextMonthBtn.addEventListener('click', () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1);
    renderMonth();
  });
  el.todayBtn.addEventListener('click', () => {
    viewMonth = new Date();
    selectedDate = new Date();
    renderMonth();
    renderPreview();
  });
  el.refreshBtn.addEventListener('click', async () => {
    await loadData(true);
    renderMonth();
    if (selectedDate) renderPreview();
  });

  async function init(){
    const cached = await loadCachedData();
    if (cached){ classRows = cached.classRows; subRows = cached.subRows; renderMonth(); }
    await loadData(false);
    renderMonth();
  }

  init();
})();
</script>
</body>
</html>
